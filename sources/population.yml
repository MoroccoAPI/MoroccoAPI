transformations:
  - Extracted the national population total, nationality breakdown, and urban/rural breakdown.
  - Published regional totals with the corresponding administrative region codes and names.
  - Published province and prefecture totals, mapping source HCP codes to administrative geography records.
  - Published commune totals and household counts, mapping HCP codes and parent units to geography records.
  - Published historical national census totals with urban/rural breakdowns.
  - Preserved the published counts without estimating missing values.



limitations:
  - Historical totals are available only at the national level; regional and subdivision time series are not included.
  - The source follows Morocco's official territorial scope, including Moroccan-administered territory in Western Sahara.
