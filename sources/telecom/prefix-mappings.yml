limitations:
  - These are Google prefix mappings, not the complete official ANRT allocation
    register.
  - Actual mapping freshness is unknown; the source revision date does not
    establish current allocation.
  - More specific prefixes override broad descriptions. The original operator is
    not necessarily the current serving operator.
  - French and English source labels are preserved; missing Arabic labels and
    HCP codes remain null.
