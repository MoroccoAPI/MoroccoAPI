limitations:
  - This is Poste Maroc's 2018 snapshot. Codes created or changed after it are missing.
  - Localities are postal places, not administrative units. A commune_code means the names match exactly in the same province, not that boundaries were verified; spelling differences (for example AFOURER and the HCP commune Afourar) leave it null.
  - 45 neighbourhood rows are excluded because their city conflicts with the province of the locality that owns their code; the 7 Settat/Berrechid rows may be valid cross-boundary assignments but cannot be confirmed from the source.
  - A neighbourhood can have several codes, for example when a code boundary crosses it. Street-level assignment is not available.
  - Names are uppercase French transliterations as published. Some neighbourhood names contain source encoding errors (for example "MOHA%ADI") and are preserved rather than corrected. No Arabic names are available.
  - One locality (JBIYEL) is labelled with the Fès-Meknès postal region but belongs to Errachidia province; region_code follows the province (Drâa-Tafilalet).
  - The source follows Morocco's official territorial scope, including Moroccan-administered territory in Western Sahara.
