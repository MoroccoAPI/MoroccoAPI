source_notes:
  - source_updated_at is the data.gov.ma resource timestamp. The resource descriptions state "Date de mise à jour : Septembre 2018"; no day is given, so none is assumed.
  - The catalogue's download links point to the retired host datagovma.webhi.net. The same resource paths are served from data.gov.ma, and the checksums above are of those files.
  - The official lookup at https://www.codepostal.ma/ states "édition 2012, version 1.2". It is not openly licensed and is not used.
  - The 2011 CSV in the localities dataset uses the former 16-region division and is not used.

transformations:
  - Read the first four columns of the localities sheet "Autres Localités", the first three of the multi-code cities sheet, and the first three of the neighbourhoods sheet "Codes postal Géographiques".
  - Collapsed repeated and non-breaking whitespace in names; spelling and case are otherwise preserved.
  - Mapped source province names to MoroccoAPI province codes by slug, with eight reviewed aliases — AGADIR IDA OUTANANE → agadir-ida-ou-tanane, BOUARFA FIGUIG → figuig, DAR DRIOUCH → driouch, EL KELAA DES SRAGHNAS → el-kelaa-des-sraghna, MOHAMMEDIA → mohammadia, RHAMNA → rehamna, TANGER ASILAH → tanger-assilah, TAROUDANT → taroudannt.
  - Derived region_code from the province. The source region label is checked but not published.
  - Assigned neighbourhoods the province and region that the multi-code cities file gives for their city.
  - Set commune_code for a locality only when `<province_code>--<slug of the locality name>` is an existing MoroccoAPI commune code; otherwise null. Multi-code cities use the same rule, with the alias ELJADIDA → el-jadida. Neighbourhoods have no commune_code.
  - Removed 34 neighbourhood rows that repeated the same city, neighbourhood and code.
  - Excluded 45 neighbourhood rows whose code belongs to a locality in a different province than their city (listed under excluded_rows). Their city label, and therefore their province and region, conflict with the source's own locality list; the rows are not corrected or reassigned.
  - Published one record per place and code, sorted by postal code, type, city and name.

