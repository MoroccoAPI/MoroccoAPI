limitations:
  - All counts describe 2024. Publication and retrieval in 2026 do not make these 2026 infrastructure counts.
  - One national record contains nine indicators. Twelve regional records contain four indicators; missing regional breakdowns remain null.
  - These are aggregate counts, not a directory of named private facilities. National and regional records must not be summed together.
