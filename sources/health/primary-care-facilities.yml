limitations:
  - The national registry covers 3065 facilities in 2024, in categories CSU-1, CSU-2, CSR-1, CSR-2 and DR. Supporting laboratories and diagnostic or reproductive-health reference centres are outside this collection.
  - last_service_event_date records an officially announced commissioning after rehabilitation or equipment in 2026. A null value means no matched announcement, not a closed facility. It is neither an original opening date nor a guarantee of present operating status.
  - The 2026 references supply factual service-event dates only. Their article text and any regional directories are not redistributed or assigned an open-data license.
  - This is a 2024 national registry with partial 2026 confirmations, not a complete national registry for 2026.
