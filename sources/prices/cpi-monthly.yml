limitations:
  - The portal file is updated about one month after HCP's monthly press release; newer months may only be available on hcp.ma as PDF.
  - Some cities publish fewer products than the national index (Dakhla 130, Béni Mellal 138, Guelmim 139, Tétouan and Laâyoune 140, Al Hoceima 141, Safi and Errachidia 145, Agadir and Meknès 147); absent series are not filled.
  - Product labels are published as in the source, in French, with its spelling, capitalisation and abbreviations (for example CONFESERIE, RCREATIFS, Collecte des ordures ménagères); they are not corrected or translated.
  - Codes in the nomenclature are not always contiguous (for example 041, 043, 044, 045 without 042); this follows HCP's adaptation of COICOP.
  - Each series averages 100 over the twelve months of 2017 to within 0.05, as expected for base 100 = 2017; the small differences come from the one-decimal rounding of the source.
  - A city's index measures price changes in that city relative to its own 2017 level; it does not compare price levels between cities.
  - The source follows Morocco's official territorial scope, including Moroccan-administered territory in Western Sahara.

refresh:
  - Check metadata_modified with the catalog_api_url; download the new I_I4166_data.xlsx and verify its SHA-256 before conversion.
  - Convert the Data sheet to a JSON array with every row and cell unchanged (empty cells as null), and compare the numeric cells with the sheet XML.
  - Update cpi-mappings.json only if the layout, month labels or cities change; update the row and column counts there.
  - Update all checksums, dates and coverage counts in this file and in src/prices/metadata.ts, then run the prices data tests and npm run check; the startup loader rejects a changed layout, a new city, a relabelled product or a non-numeric value.
