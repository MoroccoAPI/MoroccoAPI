transformations:
  - Downloaded the official workbook from data.gov.ma, verified its SHA-256, and kept its only sheet (Data) as a JSON array with one entry per source row, including the title and header rows.
  - Kept every cell exactly as stored in the workbook; empty cells (only in the title row) are null. All 318,304 numeric cells were compared with the text of the sheet XML and match it exactly (one decimal each).
  - Read the month of each column from its French header label (for example Août-2026) with cpi-mappings.json; the loader checks that the 116 columns are consecutive months, newest first, and publishes them oldest first as YYYY-MM.
  - Split each product label into its code (in parentheses) and its name, kept verbatim. The level follows the shape of the code (GR, 2, 3 or 4 digits) and the parent is the code one digit shorter (GR for a division); the loader checks that every parent exists one level up.
  - Mapped the 19 source city labels to MoroccoAPI codes and to the region where each city is located, checked against the administrative geography snapshot. National has no region.
  - Published index values unchanged. No inflation rate, average or rebased value is computed.

