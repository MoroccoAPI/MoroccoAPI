limitations:
  - This snapshot covers only the HCP Ensemble area (urban and rural combined); the workbook's separate urban and rural sheets are not published.
  - Cercles and "dont le centre urbain" detail rows are not administrative records in the MoroccoAPI geography snapshot and are excluded rather than assigned guessed codes.
  - HCP rates are published as rounded values, generally to one decimal place; no precision is reconstructed.
  - The legal population and household counts are cross-checked against the existing population domain, while other indicators remain HCP aggregates.
  - The source follows Morocco's official territorial scope, including Moroccan-administered territory in Western Sahara.

refresh:
  - Download the workbook from https://www.hcp.ma/file/242671/ and verify its SHA-256 before conversion.
  - Extract the Population and Ménages sheets for the Ensemble area with their original header rows and cell values.
  - Rebuild the two source JSON files and indicators-mappings.json, then update all checksums and coverage counts in this manifest.
  - Run the population indicator data tests and npm run check; the startup loader rejects changed headers, repeated columns, geographic links or coverage.
