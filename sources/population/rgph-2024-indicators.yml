transformations:
  - Downloaded the official HCP workbook and retained the Population and Ménages sheets for the Ensemble area, preserving every source cell in row order.
  - Converted workbook rows to JSON arrays without changing source spelling, numeric values, nulls, the HCP full stop (.) or the ellipsis (…).
  - Used indicators-mappings.json to assign stable identifiers, groups, units and French/English/Arabic labels; the loader checks every column header and repeated column.
  - Clarified the French electricity indicator label using the source concept definition, which includes solar power and generators as well as the public grid; numeric values are unchanged.
  - Linked compact HCP geographic codes to the existing RGPH 2024 administrative snapshot and published the MoroccoAPI geography names and codes.
  - Published the national row and the 12 regions, 75 subdivisions, 8 prefectures of arrondissements, 1,503 communes and 41 arrondissements.
  - Preserved HCP's four local-administration commune markers as data_from_local_administration rather than changing their values.
  - Published HCP values as numbers and represents . as unavailable, … as not_applicable, and absent sex columns as not_published.

