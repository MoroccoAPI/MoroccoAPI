transformations:
  - Downloaded the official HCP workbook and kept its three sheets (Ensemble, Urbain, Rural) as JSON arrays, one per source row, including title, header and footnote rows.
  - Kept every cell exactly as read from the workbook, including full numeric precision, empty cells as "" and the symbols ---, +++, Stag, nc and --.
  - Used poverty-mappings.json to name the published columns; the loader checks every header path, the sheet titles and footnotes, and that the three sheets list the same territories and years.
  - Typed territories by the start of their HCP name, as for the census indicators, because the workbook's own level column labels Tanger, Fès, Rabat, Salé and Marrakech as prefectures of arrondissements and arrondissements as communes.
  - Linked compact HCP geographic codes to the existing RGPH 2024 administrative snapshot and published the MoroccoAPI geography names and codes.
  - Published empty source cells as null. An area (urban or rural) without any value for a territory and year is omitted rather than filled.
  - Translated the Variation du MPI symbols to decrease (---), increase (+++), stagnation (Stag) and new_urban_centre (nc), on 2024 observations only.
  - Marked the 2014 values of the four communes HCP flags with * as aligned_with_dakhla, as explained by the workbook footnote, without changing them.
  - Checked that MPI equals the poverty rate times the intensity (H × A / 10,000) to within 0.000001 wherever the three values are present.

