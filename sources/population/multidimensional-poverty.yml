excluded_columns:
  - Contribution en pourcentage des privations de chaque indicateur au MPI (columns 18–27).
  - Décomposition du MPI par source de privation (columns 28–30).
  - Décomposition de la dynamique du MPI, entre 2014 et 2024, par source de privation (columns 32–34); only the Variation du MPI symbol (column 31) is published.

limitations:
  - The figures follow HCP's multidimensional poverty method (ten indicators in health, education and living conditions). They are not comparable with monetary poverty or with World Bank poverty lines.
  - The 2014 figures are HCP's revised 2014 estimates published with this release for comparison with 2024; they replace earlier 2014 publications for that purpose.
  - Values keep the full precision stored in the workbook; HCP reports round them. For a territory with a single area, its urban or rural values equal its all-areas values to within 0.000000001, with one exception below.
  - Source inconsistency kept as published - the 2014 years_of_schooling deprivation of the four Dakhla-aligned communes (Mijik, Lagouira, Aghouinite, Zoug) is 0 in the Ensemble sheet but 16.06985479593277 in the Rural sheet, which equals the commune of Dakhla's 2014 value.
  - When the poverty rate is 0, HCP leaves MPI, intensity and contributions empty; they are published as null, not 0.
  - HCP marks the same four communes with * on 2024 names in the Rural sheet only; the footnote describes only the 2014 alignment, so only 2014 values are flagged.
  - Cercles and "dont le centre urbain" detail rows are not administrative records in the MoroccoAPI geography snapshot and are excluded rather than assigned guessed codes.
  - The source follows Morocco's official territorial scope, including Moroccan-administered territory in Western Sahara.

refresh:
  - Download the workbook from https://www.hcp.ma/file/245096/ and verify its SHA-256 before conversion.
  - Convert the Ensemble, Urbain and Rural sheets to JSON arrays with every row and cell unchanged, and rebuild poverty-mappings.json from the header rows.
  - Update all checksums, dates and coverage counts in this file and in src/population/poverty/metadata.ts.
  - Run the population poverty data tests and npm run check; the startup loader rejects changed headers, sheets, territories, symbols or MPI inconsistencies.
