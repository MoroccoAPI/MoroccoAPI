limitations:
  - These are yearly estimates from HCP's National Employment Survey (ENE), a household sample survey. They are not the RGPH 2024 census rates in /api/v2/population/indicators, and the two differ a lot; for 2024, census unemployment is a median 10.0 points higher than the survey's across the 71 provinces with both values (from 3.9 points lower in Laâyoune to 23.5 points higher in Taza; Al Hoceima 24.6% against 8.0%). Do not mix the two sources.
  - Aousserd has no row in any sheet. Fahs-Anjra and Tarfaya have no urban rows, and Assa-Zag, Boujdour, Casablanca, Es-Semara, Laâyoune, Rabat, Tan-Tan and Tarfaya have no rural rows.
  - HCP does not publish the unemployment rate for 33 province and area pairs (Assa-Zag, Fahs-Anjra and Tarfaya as a whole, 8 urban areas and 22 rural areas) and marks a further 237 unemployment values with "-"; it also marks 10 activity and 17 employment values with "-". All are published as null.
  - Rural Oued Ed-Dahab has a published rate only for 2020, and Tarfaya as a whole has no rate for 2020 and 2022; those empty years are omitted.
  - Some provincial series move sharply from one year to the next (for example Tarfaya's activity rate, 35.0% in 2023 and 51.8% in 2024, or urban Youssoufia's unemployment rate, 27.3% in 2018 and 10.7% in 2019); HCP does not publish confidence intervals with these files.
  - The source gives rates only; the underlying population counts and the age, sex and education breakdowns are not part of these files.
  - Province and prefecture names are published in French in the source; the API uses the names of the administrative geography snapshot.
  - The source follows Morocco's official territorial scope, including Moroccan-administered territory in Western Sahara.

refresh:
  - Check metadata_modified with each catalog_api_url; download the new I_IMT_TXACT_02_data.xlsx, I_IMT_TXEMP_02_data.xlsx and I_IMT_TXCH_02_data.xlsx and verify their SHA-256 before conversion.
  - Convert each Data sheet to a JSON array with every row and cell unchanged (empty cells as null), and compare the numeric cells with the sheet XML.
  - Update labour-mappings.json only if the layout, titles, areas or province names change; update the row counts there.
  - Update all checksums, dates and coverage counts in this file and in src/population/labour/metadata.ts, then run the population labour data tests and npm run check; the startup loader rejects a changed layout, an unmapped province, a value outside 0–100 or inconsistent rates.
