transformations:
  - Downloaded the three official workbooks from data.gov.ma, verified their SHA-256, and kept the only sheet of each (Data) as a JSON array with one entry per source row, including the title and header rows.
  - Kept every cell exactly as stored in the workbook; empty cells (only in the title row) are null and the not-published symbol "-" is kept as text. All 5,163 numeric cells were compared with the text of the sheet XML and match it exactly (one decimal each).
  - Read the year of each column from its four-digit header label; the loader checks that the columns are consecutive years, newest first, identical in the three sheets, and publishes them oldest first.
  - Mapped the Milieu labels National, Urbain and Rural to the areas all, urban and rural. National means the whole province or prefecture (urban and rural together), not Morocco as a whole.
  - Mapped the 74 source province and prefecture names to MoroccoAPI codes with labour-mappings.json; each name equals the French name of one province or prefecture in the administrative geography snapshot, ignoring accents, case and punctuation. Names, HCP codes and regions come from that snapshot.
  - Joined the three sheets on province and area. The activity sheet lists every province and area; the employment sheet lists the same rows and the unemployment sheet a subset of them. A rate without a source row, or marked "-", is published as null; a province, area and year with no published rate at all is omitted.
  - Published the rates unchanged. No rate is computed, filled or rounded.
  - Checked that employment never exceeds activity, and that employment equals activity × (1 − unemployment ÷ 100) to within 0.15 points wherever the three rates are published (1,374 cases; largest gap 0.113, from the one-decimal rounding of the source).

