definitions:
  reference: https://www.hcp.ma/Concepts-et-definitions-Activite_a3038.html
  note: The metadata workbooks only repeat each indicator's name as its definition (periodicity Annuelle, unit POURCENTAGE, source MAR_HCP ENQUETE NATIONALE SUR L'EMPLOI), so the definitions below follow HCP's published labour concepts.
  activity_rate: Active persons (employed or unemployed) aged 15 and over, as a percentage of the population aged 15 and over.
  employment_rate: Employed persons aged 15 and over, as a percentage of the population aged 15 and over.
  unemployment_rate: Unemployed persons, as a percentage of the labour force (active persons).

