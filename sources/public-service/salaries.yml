transformations:
  - Converted the CSV (corps_ar, grade_fr, net_monthly_salary_mad, source_url) to JSON records.
  - Added a stable `code` slug derived from the French grade name (accents removed, lower case, hyphens).
  - Percent-encoded the per-grade reference URLs.
  - Kept the published values unchanged; no salary was recomputed or estimated.

limitations:
  - Secondary dataset compiled by Wadifa Info; the values are simulated references, not official salary entitlements.
  - Simulation settings are the first echelon, single, no children, no mutuelle, and the highest residence-allowance zone (Rabat or Casablanca are about 150-350 MAD lower).
  - 320 of 370 rows matched the official simulator to the cent on 2026-09-30; the other 50 are grades the simulator lists under different names.
  - Grade names are available in French only and corps names in Arabic only; missing translations are not fabricated.
  - Values change when salary decrees change; updates are released as new Zenodo versions.
