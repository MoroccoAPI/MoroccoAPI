sources:
  - language_fields: [ar, fr]
    dataset: Morocco civil-service net salaries by grade (2026)
    producer: Wadifa Info (secondary dataset compiled from simulation.mmsp.gov.ma)
    catalog_url: https://doi.org/10.5281/zenodo.23078290
    resource_url: https://zenodo.org/api/records/23078291/files/morocco_civil_service_net_salaries_2026.csv/content
