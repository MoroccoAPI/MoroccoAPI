title: FNM museum inventory, September 2026
version: 1.0.0
reviewed_at: 2026-10-14
retrieved_at: 2026-10-14
source_version: Septembre 2026
source_license: ODbL-1.0
license_url: https://opendatacommons.org/licenses/odbl/1-0/
contains_personal_data: false
privacy_review: Public institutional visitor contacts only; no staff or visitor records.
redistribution_review: approved
record_count: 23
city_count: 11
region_count: 7
scope: FNM inventory; not an exhaustive census of all Moroccan museums.
attribution: >-
  Contains factual information from Liste des musées au Maroc and Guide des
  musées du Maroc, produced by Fondation Nationale des Musées (FNM), obtained
  from data.gov.ma under ODbL 1.0. Normalized by MoroccoAPI, version 1.0.0.
  HCP RGPH 2024 geographic associations retain CC BY 4.0 attribution.
reuse: >-
  The adapted database is distributed under ODbL 1.0. Preserve attribution and
  the license notice and meet applicable share-alike obligations. Original
  images, lengthy descriptive prose and unlicensed research pages are excluded.
