transformation:
  input: Reviewed September 2026 XLSX and DOCX facts, plus existing HCP geography.
  snapshot: data/museums/museums.json
  implementation: src/museums/data.ts
  steps:
    - Preserve all 23 source museums, original French spellings and visitor text.
    - Normalize whitespace without correcting source names or inventing facts.
    - Use official Arabic guide headings; leave museum English names null.
    - Retain guide French headings as aliases when different from the XLSX name.
    - Preserve stable internal IDs and exact commune/region associations.
    - Normalize valid ten-digit institutional phones; keep missing/incomplete values null.
    - Extract social handles without inferring a platform.
    - Flag shared numbers, incomplete contacts, spelling differences and works/hours conflicts.
    - Leave coordinates null and current operating status unknown.
  verification: node --import tsx --test test/museums/*.test.ts
endpoints:
  - GET /api/v1/museums
  - GET /api/v1/museums/{id}
filters: q, city_code, region_code; combined with AND.
update_frequency: No fixed publication schedule documented.
update_behavior: >-
  Updates require review of the source edition, license, matching keys, contacts
  and geography, with tests. Preserve existing IDs when a museum name changes.
  Requests reuse a validated immutable snapshot without network access.
limitations:
  - FNM coverage excludes museums operated by other public or private institutions.
  - Both open-data resources list 23 museums; the FNM website lists 22.
  - The extra entry is Musée de la Culture Juive Marocaine in Fès; current operation is unknown.
  - The FNM directory at https://www.fnm.ma/museums/ is a link-only cross-check.
  - Azilal's phone has nine digits in both sources; it is not repaired.
  - Four XLSX museums have no phone; eleven records share a number with another record.
  - Dar Si Said mentions works in the XLSX, while the guide gives ordinary hours.
  - The Casablanca photography museum's XLSX spelling says photographic; its alias preserves photographie.
  - Hours and tariffs describe September 2026, not a live visitor service.
  - Tariff excerpts omit some general free-entry and reduction conditions in the guide.
