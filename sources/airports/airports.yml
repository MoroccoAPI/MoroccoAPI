limitations:
  - Community-maintained inventory, not an official ONDA or civil-aviation registry.
  - File revision is October 2026; per-record verification dates are unavailable.
  - Includes source-marked closed sites, heliports and public entries named as air bases.
  - The pinned CSV uses type closed; the dictionary says closed_airport. Actual CSV values are retained.
  - Missing ICAO or IATA values remain null; 17 records cannot be retrieved by ICAO.
  - Casablanca Tit Mellil has ident GMMT but no explicit ICAO code in this revision.
  - Kenitra has ident GMMY and explicit ICAO GMMP; Guelmim has ident MA-GLN and ICAO GMAG.
  - Source municipality is the municipality served, not a geocoded administrative assignment.
  - iso_region retains OurAirports codes and is not joined to MoroccoAPI HCP geography.
  - Source classifications, coordinates and service flags may be inaccurate or stale.
  - Exact MA filtering excludes entries assigned EH by OurAirports, including Dakhla and Laayoune.
  - This source-country convention differs from the territorial scope of the HCP geography datasets.
