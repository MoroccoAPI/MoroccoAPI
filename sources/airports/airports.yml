transformation:
  snapshot: data/airports/airports.json
  implementation: src/airports/data.ts
  steps:
    - Select every row whose iso_country is exactly MA, without bounding-box guesses.
    - Preserve numeric id, ident, name, type, municipality, iso_country and iso_region.
    - Use only explicit icao_code and iata_code fields; empty codes become null.
    - Never infer ICAO from ident, gps_code, keywords or historical codes.
    - Parse source latitude_deg and longitude_deg as location latitude and longitude.
    - Parse scheduled_service yes/no as true/false without asserting live availability.
    - Exclude optional URLs, keywords, elevation and unrelated infrastructure datasets.
    - Sort by persistent numeric source id and reject duplicate IDs, idents or ICAO codes.
  verification: node --import tsx --test test/airports/*.test.ts
endpoints:
  - GET /api/v1/airports
  - GET /api/v1/airports/{icao}
filters: q, city, type, scheduled_service; combined with AND.
lookup: Case-insensitive explicit four-letter icao_code only.
update_frequency: Source CSV regenerated nightly.
update_behavior: >-
  Refreshes require a reviewed upstream revision, source checksum, country/type
  counts and code changes. Update the pinned snapshot and tests together.
  Requests use an immutable local snapshot with no network access. A new global
  file revision does not imply that every Moroccan airport has been reverified.
