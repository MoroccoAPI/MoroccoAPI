source_notes:
  - The series metadata endpoint is paginated by metadata entry, not by indicator (21,403 entries for 1,498 indicators; 22 pages at per_page=1000). The snapshot was taken in a single request with per_page=30000, which the API answered as page 1 of 1, so every page is included. The loader also rejects any CSV indicator without metadata, so a truncated response cannot be published.
  - The license is declared per indicator (License_Type and License_URL in the series metadata). Only CC BY 4.0 indicators are served by the API; data/world-bank/mappings.json lists the API exclusions. The committed raw snapshot remains complete and mixed-license; raw_licensing lists its nine non-CC BY 4.0 exceptions and their 307 observations. Repository availability does not replace their applicable terms.
  - Several indicators come from third parties credited in the Source field (for example ITU, the UN Population Division, ILO or IMF). Their attribution request (Othernotes, e.g. "Please cite the International Telecommunication Union for third-party use of these data.") is published as citation_note.
  - The values are World Bank compilations and estimates. Where a Moroccan official source exists (for example HCP census population), that source remains the official reference.

files:
  raw: >-
    data/world-bank/source/API_MAR_DS2_en_csv_v2.csv is the values file of the bulk archive with only its line endings
    converted from CRLF to LF, because the repository stores text with LF (.gitattributes); the UTF-8 byte order mark and
    every value are unchanged, including the nine series excluded from the API. These raw observations retain their
    per-indicator licenses, not the API's uniform CC-BY-4.0 license. data/world-bank/source/indicator-metadata.json keeps, for each of the 1,498 indicators in
    the CSV, nine fields of the series metadata with their values unchanged: IndicatorName, Topic, Unitofmeasure,
    Periodicity, Source, License_Type, License_URL, Othernotes and Shortdefinition.
  mappings: >-
    data/world-bank/mappings.json holds the API's allowed license type and the API-excluded indicators with their license. It does not remove or relicense rows in the raw source files.
  transformation: >-
    src/world-bank/data/transform.ts builds the published indicators from the raw files and the mapping file when the API
    starts. The build fails if the CSV layout changes, an indicator has no metadata, a non-allowed license is not listed,
    an exclusion is unused, or the CSV date differs from the date declared in src/world-bank/metadata.ts.

refresh:
  - Download https://api.worldbank.org/v2/en/country/MAR?downloadformat=csv and unzip it; take API_MAR_DS2_en_csv_v2_*.csv.
  - Convert its line endings from CRLF to LF (nothing else) and save it as data/world-bank/source/API_MAR_DS2_en_csv_v2.csv.
  - Request the series metadata with per_page at least the reported total (or follow every page), and check that the response says pages equals page (one page) or that all pages were combined.
  - For every indicator code in the CSV, keep IndicatorName, Topic, Unitofmeasure, Periodicity, Source, License_Type, License_URL, Othernotes and Shortdefinition unchanged (missing fields as null), sorted by code, in data/world-bank/source/indicator-metadata.json.
  - Review License_Type and License_URL for every raw series before refreshing the committed snapshot. Preserve the original licenses and notices, update raw_licensing with every non-CC BY 4.0 exception and its observation count, and review changed terms rather than treating repository inclusion as permission. Keep the published API license scope separate from the mixed-license raw files.
  - Update WDI_LAST_UPDATED in src/world-bank/metadata.ts and source_updated_at, the checksums, response_pagination and coverage in this file; add any newly non-CC BY 4.0 indicator to data/world-bank/mappings.json for API exclusion. Run npm run check; the loader and tests reject any mismatch.

transformations:
  - Parsed the bulk CSV (two header lines, then one row per indicator with yearly columns 1960–2025).
  - Kept every non-empty yearly value as a number; years without a value are omitted, never filled in.
  - Served through the API only indicators whose License_Type is CC BY-4.0 and that have at least one value. The committed raw snapshot keeps every original observation under its per-indicator license.
  - Took the indicator name from the CSV. The metadata API words 101 names differently (for example "(BoP, current US$)" instead of "(current US$, BoP)"), and the CSV name is the one published with the values.
  - Derived topic_code from the first part of the World Bank Topic (for example "Infrastructure: Communications" → infrastructure); the full Topic is also published.
  - Published License_Type CC BY-4.0 as the identifier CC-BY-4.0 used across MoroccoAPI.

