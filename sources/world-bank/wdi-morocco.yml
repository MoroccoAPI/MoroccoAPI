source_notes:
  - The license is declared per indicator (License_Type in the series metadata). Only CC BY 4.0 indicators are published; data/world-bank/mappings.json lists the excluded ones.
  - Several indicators come from third parties credited in the Source field (for example ITU, the UN Population Division, ILO or IMF). Their attribution request (Othernotes, e.g. "Please cite the International Telecommunication Union for third-party use of these data.") is published as citation_note.
  - The values are World Bank compilations and estimates. Where a Moroccan official source exists (for example HCP census population), that source remains the official reference.

files:
  raw: >-
    data/world-bank/source/API_MAR_DS2_en_csv_v2.csv is the values file of the bulk archive with only its line endings
    converted from CRLF to LF, because the repository stores text with LF (.gitattributes); the UTF-8 byte order mark and
    every value are unchanged. data/world-bank/source/indicator-metadata.json keeps, for each of the 1,498 indicators in
    the CSV, nine fields of the series metadata with their values unchanged: IndicatorName, Topic, Unitofmeasure,
    Periodicity, Source, License_Type, License_URL, Othernotes and Shortdefinition.
  mappings: >-
    data/world-bank/mappings.json holds the allowed license type and the excluded indicators with their license.
  transformation: >-
    src/world-bank/data/transform.ts builds the published indicators from the raw files and the mapping file when the API
    starts. The build fails if the CSV layout changes, an indicator has no metadata, a non-allowed license is not listed,
    an exclusion is unused, or the CSV date differs from the date declared in src/world-bank/metadata.ts.

transformations:
  - Parsed the bulk CSV (two header lines, then one row per indicator with yearly columns 1960–2025).
  - Kept every non-empty yearly value as a number; years without a value are omitted, never filled in.
  - Published indicators whose License_Type is CC BY-4.0 and that have at least one value.
  - Took the indicator name from the CSV. The metadata API words 101 names differently (for example "(BoP, current US$)" instead of "(current US$, BoP)"), and the CSV name is the one published with the values.
  - Derived topic_code from the first part of the World Bank Topic (for example "Infrastructure: Communications" → infrastructure); the full Topic is also published.
  - Published License_Type CC BY-4.0 as the identifier CC-BY-4.0 used across MoroccoAPI.

coverage:
  indicators_in_csv: 1498
  indicators_without_values: 127
  excluded_indicators: 9
  published_indicators: 1362
  published_values: 46433
  topics: 13
  years: 1960–2025

limitations:
  - Values are international estimates that can differ from Moroccan official statistics and are revised in later World Development Indicators releases. This snapshot is the 2026-10-08 release.
  - Annual series only (a few indicators are triennial, five-yearly or ad hoc, as stated in periodicity); many series have gaps.
  - Names, definitions and topics are in English only.
  - 301 indicators have no unit of measure in the metadata; their unit is published as null and appears only in the name.
  - Nine indicators with Moroccan values are not published because of their license (six SIPRI military series, three Women, Business and the Law series under CC BY 3.0 IGO).
