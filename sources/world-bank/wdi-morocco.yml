  years: 1960–2025

limitations:
  - Values are international estimates that can differ from Moroccan official statistics and are revised in later World Development Indicators releases. This snapshot is the 2026-10-08 release.
  - Annual series only (a few indicators are triennial, five-yearly or ad hoc, as stated in periodicity); many series have gaps.
  - Names, definitions and topics are in English only.
  - 301 indicators have no unit of measure in the metadata; their unit is published as null and appears only in the name.
  - Nine indicators with Moroccan values are excluded from the API because their licenses differ from its CC-BY-4.0 scope (six SIPRI military series, three Women, Business and the Law series under CC BY 3.0 IGO). They remain in the mixed-license raw snapshot with their original per-indicator license metadata; see raw_licensing.
