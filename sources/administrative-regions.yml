transformations:
  - Selected the 12 region labels from each source workbook.
  - Removed the Arabic prefix "جهة" and normalized dash spacing.
  - Matched Arabic and French records by region name.
  - Created stable MoroccoAPI slug identifiers; these are not official administrative codes.
  - Added English transliterations maintained by MoroccoAPI; these are not official source translations.

limitations:
  - This snapshot contains regions only; it does not include provinces, prefectures, or communes.
  - The API is a community service and is not a source of legal or administrative authority.
