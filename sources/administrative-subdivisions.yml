transformations:
  - Selected 75 top-level provinces/prefectures, 8 prefectures of arrondissements, 1,503 communes, and 41 arrondissements.
  - Preserved every selected unit's HCP code in `hcp_code`.
  - Preserved HCP's French and Arabic names for every selected unit.
  - Distinguished 62 provinces from 13 prefectures in `administrative_type`.
  - Stored prefectures of arrondissements separately and linked Casablanca's arrondissements to them.
  - Stored arrondissements separately and linked each to its parent commune.
  - Preserved each commune's RGPH 2024 parent cercle code in `cercle_hcp_code` when present.
  - Retained stable, province-qualified MoroccoAPI slugs in `code`.

limitations:
  - English subdivision names are unavailable from this HCP source and remain null.
  - MoroccoAPI slugs are not official administrative codes.
  - This snapshot reflects the administrative division used by RGPH 2024.
  - Cercles are not published as a standalone dataset because their legal organization changed after RGPH 2024, including in 2025.
  - Urban centres in the workbook are statistical units and are outside this administrative API scope.
  - The source follows Morocco's official territorial scope, including Moroccan-administered territory in Western Sahara.
