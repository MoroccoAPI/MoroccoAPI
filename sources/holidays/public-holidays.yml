id: moroccan-public-holidays
title: Common Moroccan public-administration holidays and business days
version: 1.0.0
reviewed_at: 2026-10-13
supported_years: [2024, 2025, 2026, 2027]
confirmed_religious_years: [2026]
contains_personal_data: false
source_license: LicenseRef-MA-Law-2-00-Article-8
license_url: https://www.wipo.int/wipolex/fr/legislation/details/19766
copyright_basis:
  law: Moroccan Law 2-00, Article 8(a) and 8(c)
  cited_consolidation_url: https://wipolex-res.wipo.int/edocs/lexdocs/laws/fr/ma/ma073fr.pdf
  scope: Official legal rules and simple date facts only
  review: >-
    No blanket open license is claimed for government websites. This contribution
    normalizes legal holiday rules and officially announced date facts under the
    statutory exclusion for official texts and simple data. It does not reproduce
    website prose, images, page layouts, or a third-party calendar database.
    Maintainers should review this narrow basis before admitting the dataset.
  website_terms_url: https://www.mmsp.gov.ma/fr/mentions-l%C3%A9gales
  website_terms_review: >-
    The ministry website asserts copyright and requires written consent for
    reproduction of its text and illustrations. Its explanatory holiday page is
    link-only. The source of the recurring rules is the official decree instead.
