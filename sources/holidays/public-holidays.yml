    source_updated_at: null
    first_day: 2026-05-27
    hijri_date: 10 Dhu al-Hijjah 1447
  - id: mawlid-2026
    producer: Ministry of Habous and Islamic Affairs
    source_url: https://habous.gov.ma/آخر-المقالات.html?id=1616%3Aمدرسة-الإمام-الشاطبي-الخاصة&start=100
