transformation:
  input: Manually reviewed legal rules and first-day confirmations
  implementation: src/holidays/data.ts and src/holidays/calendar.ts
  steps:
    - Expand recurring Gregorian rules within the documented year horizon.
    - Apply Unity Day only from the 2026 amendment.
    - Expand confirmed Eid and Mawlid first days into two consecutive civil dates.
    - Leave unreviewed religious Gregorian dates null, including historical years.
    - Normalize Arabic and French labels and provide original English translations.
    - Count each closed civil date once; do not invent substitute weekdays.
  verification: node --import tsx --test test/holidays/*.test.ts
update_frequency: On legal changes and official religious-date announcements
update_behavior: >-
  Updates require a reviewed manifest entry and tests. The API uses pinned local
  facts without network access. Source failures retain the reviewed snapshot;
  unconfirmed dates remain unknown. Extend the year horizon only after review.
limitations:
  - Common calendar for public administrations, public establishments and concessionary services.
  - Employee-specific religious observances and special schedules are outside scope.
  - Exceptional closures, bridge days, bank and school calendars are outside scope.
  - No claim that a business-day result guarantees an office will be open.
  - The source pages were reviewed via official indexed content where direct access failed.
  - Future legal changes may invalidate projected fixed dates.
